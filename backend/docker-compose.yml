services:
  # ============================================================
  # PostgreSQL 16 — primary datastore
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: codemart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-codemart}
      POSTGRES_USER: ${DB_USER:-codemart}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-codemart_strong_password_change_me}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-codemart} -d ${DB_NAME:-codemart}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codemart-net

  # ============================================================
  # Redis 7 — cache, sessions, rate-limit, cart storage
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: codemart-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_strong_password_change_me}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_strong_password_change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codemart-net

  # ============================================================
  # CodeMart NestJS API
  # ============================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codemart-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${APP_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codemart-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  codemart-net:
    driver: bridge
